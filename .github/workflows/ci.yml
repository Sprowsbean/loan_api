name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python train.py      # the tests load the model file this writes
      - run: pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Trigger the Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST -o /dev/null "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"

      - name: Verify the live app runs this commit
        env:
          APP_URL: ${{ vars.APP_URL }}
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -u
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$APP_URL/health" | jq -r .sha || echo none)
            echo "attempt $i: live sha = $live (want $GITHUB_SHA)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              seconds=$(( $(date +%s) - $(date -d "$MERGED_AT" +%s) ))
              echo "Live after ${seconds}s"
              {
                echo "### Deployed"
                echo "- Commit: \`$GITHUB_SHA\`"
                echo "- Merge to live: **${seconds}s**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live app never reported $GITHUB_SHA within 10 minutes"
          exit 1
